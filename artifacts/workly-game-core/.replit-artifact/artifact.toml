kind = "web"
previewPath = "/"
title = "Workly Game Core"
version = "1.0.0"
id = "artifacts/workly-game-core"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20177

[services.development]
run = "pnpm --filter @workspace/workly-game-core run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/workly-game-core", "run", "build" ]
serve = "static"
publicDir = "artifacts/workly-game-core/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20177"
BASE_PATH = "/"
